# sythesis_test 评估配置

# LLM 网关 URL / key、沙盒 key 统一在 settings/settings.yaml 中配置

# 全局默认模型配置
vision_model:
  family: "qwen"
  model_id: "qwen3.6-plus"

# Solver Agent 配置
solver:
  family: "vllm"
  model_id: "Qwen3-4B-Thinking-2507-ft-ckpt2000"
  ports: [8000,8001,8002,8003,8004,8005,8006,8007]  # vLLM 部署端口，自动拼接 http://localhost:{port}/v1
  max_steps: 50
  upload_skills: false

# Evaluator Agent 配置
evaluator:
  family: "qwen"
  model_id: "gemini-3.1-pro-preview"
  ports: []              # vLLM 部署端口，为空则使用全局 api.url
  max_steps: 50
  upload_skills: false

# 运行配置
run:
  limit: 88          # 评估任务数量，-1 表示全部
  concurrency: 15     # 并发数
  output_dir: "results"

# 数据配置
data:
  path: "data/test.parquet"
  base_dir: "."      # reference_files 和 deliverable_files 的根目录

# 沙盒配置
sandbox:
  image: "rle/aio-sandbox:origin-260312"
  timeout: 1800
  session_timeout: 10080
  path: "sythesis_test/sandbox/Qwen3-4B/sandbox_sessions"

agent_run:
  solver: true
  evaluator: true
  max_tool_response_length: 4096  # tool 响应截断长度，0 表示不截断