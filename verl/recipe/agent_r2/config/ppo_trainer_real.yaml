hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  # Preprocessed parquet with tools_kwargs in extra_info
  train_files: ???
  val_files: null
  max_prompt_length: 4096
  max_response_length: 40960
  train_batch_size: 8
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: "error"
  shuffle: False

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ???
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: False
      optimizer_offload: False
  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    n: 1
    gpu_memory_utilization: 0.5
    tensor_model_parallel_size: 1
    max_model_len: 40960
    log_prob_micro_batch_size_per_gpu: 1
    multi_turn:
      enable: True
      max_assistant_turns: 30
      tool_config_path: ???
      max_tool_response_length: 2048
      tool_response_truncate_side: middle
      format: hermes
      max_parallel_calls: 5
      # Terminate rollout on tool-argument parse failure (default). Set True to return an error
      # tool response and keep rolling out; parse_penalty only applies when this is True.
      continue_rollout_on_parse_failure: False
      # Penalise turns where tool-call JSON was malformed (only when continue_rollout_on_parse_failure=True)
      parse_penalty: True
      parse_penalty_value: 0.5
      # Penalise turns where terminal / view_image_text tool execution errored
      terminal_penalty: True
      terminal_penalty_value: 0.5
      # Sandbox session pool directory (contains pre-checked *.id files)
      sandbox_session_pool_dir: ""
      # Sandbox connection config shared across all tools in a trajectory
      sandbox_config:
        tool_type: "aio_sandbox"
        env: "test"
      # LLM configuration for the reward judge model
      reward_config:
        llm_family: "qwen"
        llm_model_id: "qwen3.6-plus"
        # Show reference files to the reward judge (default off = deliverable-only judging).
        use_reference_files: false
        # Where to find reference files when extra_info has no explicit "reference_files" list:
        # <extra_info.sample_dir>/<reference_subdir>/*  (e.g. "claude_solver_tmp/output"); null = disabled
        reference_subdir: null
    agent:
      default_agent_loop: "real_agent"
      agent_loop_config_path: ???
      num_workers: 1
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: True

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False

trainer:
  total_epochs: 10
  project_name: "real_rl"
  experiment_name: "solver_grpo"
  logger: ["console"]
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 5
  test_freq: -1
  critic_warmup: 0
  val_before_train: False
