working_dir: ./
excludes: ["/.git/"]
# llm and settings packages from the inner Agent-R2/ directory (used by recipe/agent_r2);
# paths are relative to the verl root, where `ray job submit` is run
py_modules: ["../Agent-R2/llm", "../Agent-R2/settings"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_USE_V1: "1"
  VERL_LOGGING_LEVEL: "INFO"
  CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
